apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-reviewer-fe
  namespace: smart-reviewer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smart-reviewer-fe
  template:
    metadata:
      labels:
        app: smart-reviewer-fe
    spec:
      containers:
        - name: fe
          image: ghcr.io/martin-nef/smart-reviewer:c48a25488d91e9f9bfc56e5c36b8c0035001f2d5-fe
          ports:
            - containerPort: 80
          env:
            - name: API_URL
              value: "https://smart-reviewer-api.nefcloud.top"
