apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: smart-reviewer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongo
  template:
    metadata:
      labels:
        app: mongo
    spec:
      # The image's mongodb user. Started as root, the entrypoint only chowns
      # /data/db and drops to this user; fsGroup makes the volume writable
      # instead.
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongo
          # Not 8.x/9.x: since 8.0.21 they refuse to start on kernels 6.19+,
          # and the nodes' Ubuntu kernel reports 7.0.0 so the 7.0.14+ exemption
          # never matches (SERVER-125742, SERVER-136848). 7.0 is unaffected and
          # is what CI tests against.
          image: mongo:7.0
          ports:
            - containerPort: 27017
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
      volumes:
        - name: mongo-data
          emptyDir: {}
