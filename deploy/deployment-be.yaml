apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-reviewer-be
  namespace: smart-reviewer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: smart-reviewer-be
  template:
    metadata:
      labels:
        app: smart-reviewer-be
    spec:
      # The image's rails user, with no way to gain privileges back.
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: be
          image: ghcr.io/martin-nef/smart-reviewer:f05d14264482ff02e247d05b3096f17d7b5c9e48-be
          ports:
            - containerPort: 3000
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: MONGO_URI
              value: "mongodb://mongo:27017/smart_reviewer"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: smart-reviewer-secrets
                  key: OPENAI_API_KEY
            - name: GNEWS_API_KEY
              valueFrom:
                secretKeyRef:
                  name: smart-reviewer-secrets
                  key: GNEWS_API_KEY
