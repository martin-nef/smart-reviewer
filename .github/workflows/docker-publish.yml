name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ labeled ]

# Deploy sequentially: queue runs on the same branch and never cancel an
# in-progress build/bump, so every commit gets built and deployed in order.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Work out which containers this push (or labeled PR) touched. Only those are
  # built and re-pinned; the others keep their currently deployed image.
  changes:
    if: >
      github.event_name == 'push' || (github.event_name == 'pull_request' &&
      github.event.label.name == 'build')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      containers: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            be:
              - 'be/**'
              - '.github/workflows/docker-publish.yml'
            fe:
              - 'fe/**'
              - '.github/workflows/docker-publish.yml'

  build-and-push:
    needs: changes
    if: needs.changes.outputs.containers != '[]'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: true
      matrix:
        container: ${{ fromJSON(needs.changes.outputs.containers) }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The registry cache lives next to the images; mode=max also caches the
      # intermediate build stage (apt + bundle install / npm install) so that
      # a rebuild after a code-only change skips them on both architectures.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.container }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}-${{matrix.container}}
            ${{ github.event_name == 'push' && format('ghcr.io/{0}:latest-{1}', github.repository, matrix.container) || '' }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.container }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:buildcache-${{ matrix.container }},mode=max,image-manifest=true,oci-mediatypes=true

  # Trunk deploy: pin the deploy manifests of the containers just built to this
  # SHA and commit back to main. Flux's GitRepository (1m poll) picks up the
  # commit and rolls the Deployments. The GITHUB_TOKEN push does not retrigger
  # workflows, and "[skip ci]" guards against any future loop.
  bump-manifests:
    needs: [ changes, build-and-push ]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pin built images to ${{ github.sha }}
        env:
          CONTAINERS: ${{ needs.changes.outputs.containers }}
        run: |
          repo="ghcr.io/${{ github.repository }}"
          for container in $(jq -r '.[]' <<< "$CONTAINERS"); do
            sed -i -E "s#(image: ${repo}):.*-${container}\$#\1:${{ github.sha }}-${container}#" "deploy/deployment-${container}.yaml"
          done

      - name: Commit and push
        run: |
          if git diff --quiet -- deploy; then
            echo "Manifests already pinned to ${{ github.sha }}; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/deployment-be.yaml deploy/deployment-fe.yaml
          git commit -m "chore: deploy ${{ github.sha }} [skip ci]"
          git push origin main
