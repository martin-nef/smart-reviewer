version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: docker
    directories:
      - be
      - fe
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      docker:
        patterns:
          - "*"
  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      docker-compose:
        patterns:
          - "*"
